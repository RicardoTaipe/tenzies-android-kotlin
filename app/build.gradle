plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace = 'com.example.tenziesapp'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.tenziesapp"
        minSdk 23
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        dataBinding = true
    }
    testOptions {
        // Used for Unit testing Android dependent elements in /test folder
        unitTests.includeAndroidResources = true
        unitTests.returnDefaultValues = true
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE.md', 'META-INF/LICENSE.txt', 'META-INF/NOTICE.md', 'META-INF/LICENSE-notice.md', 'META-INF/NOTICE.txt']
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.0'
    implementation "androidx.fragment:fragment-ktx:1.5.5"
    implementation 'com.google.android.material:material:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'nl.dionsegijn:konfetti-xml:2.0.5'
    implementation 'androidx.test:core-ktx:1.7.0'

    testImplementation 'junit:junit:4.13.2'
    //for livedata
    testImplementation "androidx.arch.core:core-testing:2.2.0"

    //Mockk for unit testing
    testImplementation "io.mockk:mockk:1.14.6"
    //kotest for assertions
    testImplementation 'io.kotest:kotest-assertions-core:6.0.3'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation "io.mockk:mockk:1.14.6"
    androidTestImplementation "io.mockk:mockk-android:1.14.6"
    androidTestImplementation "io.mockk:mockk-agent:1.14.6"
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    //libs
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.6.1'
    implementation 'androidx.test.espresso:espresso-idling-resource:3.6.1'
}